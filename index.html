<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#194a40" />
    <meta
      name="description"
      content="Tu dinero, a tu ritmo. Gastos, cuentas y presupuestos personales en bolivianos."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="gástalo" />
    <title>gástalo</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=44" />
    <script src="./app.js?v=44" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Ir al contenido</a>
    <header class="app-header">
      <details id="app-menu" class="app-menu">
        <summary aria-label="Abrir menú" title="Menú">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </summary>
        <nav aria-label="Navegación principal">
          <div class="brand menu-brand" aria-label="gástalo">
            <span class="brand-mark" aria-hidden="true">g</span>gástalo<span class="brand-dot">.</span>
          </div>
          <button data-action="movement">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" /></svg>+ Movimiento
          </button>
          <button data-view="home" class="active">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 10 8-7 8 7v11H4Z" /></svg>Inicio
          </button>
          <button data-view="history">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4m8-4v4M3 11h18M8 15h2m4 0h2m-8 3h2" /></svg>Historial
          </button>
          <button data-view="budgets">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5M2 8h16M5 12h3m-3 2h1M10 21a6 6 0 0 1 12 0Zm6-3 3-2" /></svg>Límites de categoría
          </button>
          <button data-view="reports">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12 9 6l4 3 7-7m-4 0h4v4" /><path d="M3 16h4v6H3Zm7-4h4v10h-4Zm7-4h4v14h-4Z" /></svg>Gráficos
          </button>
          <button data-view="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 18v3h8v-3M6 16V3M3 6l3-3 3 3m5 12v3h8v-3M18 3v13m-3-3 3 3 3-3" /></svg>Importar/Exportar
          </button>
        </nav>
      </details>
      <div id="header-totals"></div>
    </header>
    <main id="main" tabindex="-1">
      <p class="empty">Abriendo tu espacio…</p>
    </main>
    <footer class="app-footer">
      <div class="header-end">
        <span id="app-version" class="muted"></span>
        <button id="update-app" type="button">Actualizar app</button>
        <span id="offline" hidden>Sin conexión</span
        ><button id="undo-button" data-action="undo" hidden>Deshacer</button>
      </div>
    </footer>
    <noscript
      >gástalo necesita JavaScript para guardar tus gastos en este
      dispositivo.</noscript
    >
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="modal-form">
        <div class="dialog-heading">
          <h2 id="dialog-title"></h2>
          <button
            type="button"
            data-action="close"
            aria-label="Cerrar formulario"
          >
            ×
          </button>
        </div>
        <div id="dialog-body"></div>
        <p id="modal-error" role="alert"></p>
      </form>
    </dialog>
  </body>
</html>
