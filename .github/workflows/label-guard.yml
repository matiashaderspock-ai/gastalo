name: Label guard
on:
  workflow_call:
    outputs:
      needs_matias:
        value: ${{ jobs.guard.outputs.needs_matias }}
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      needs_matias: ${{ steps.review.outputs.needs_matias }}
    steps:
      # Inspect API data only; never check out or execute pull-request code with this token.
      - uses: actions/github-script@v7
        id: review
        with:
          script: |
            const repo = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: issue_number });
            const files = await github.paginate(github.rest.pulls.listFiles, { ...repo, pull_number: issue_number, per_page: 100 });
            const label = 'needs-matias';
            try { await github.rest.issues.getLabel({ ...repo, name: label }); }
            catch (error) {
              if (error.status !== 404) throw error;
              try { await github.rest.issues.createLabel({ ...repo, name: label, color: 'B60205', description: 'Revisión de Matias: sincronización, borrado, reset o política de merge' }); }
              catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.getLabel({ ...repo, name: label });
              }
            }
            const marker = /sync_config|uploadBackup|syncConfig|gastalo-data|gastalo-backup|Restablecer todo|reset-app|eraseEntity|deleteTransaction|deleteDatabase|deleteObjectStore|deleted_at|["']deleted["']|\.(?:delete|clear|removeItem)\s*\(/i;
            let mergeBase;
            function ranges(source) {
              const lines = source.split('\n'), result = [];
              for (let i = 0; i < lines.length; i++) {
                const fn = /^(\s*)(?:async )?function (\w+)\s*\(/.exec(lines[i]) ||
                  /^(\s*)(?:const|let|var) (\w+)\s*=.*=>\s*\(?\{/.exec(lines[i]);
                if (!fn || !/sync|backup|reset|delete|erase|remove|^commit$|^previewImport$/i.test(fn[2])) continue;
                let end = i + 1;
                while (end < lines.length && !lines[end].startsWith(fn[1] + '}')) end++;
                result.push([i + 1, end + 1]);
              }
              return result;
            }
            async function source(path, ref) {
              const { data } = await github.rest.repos.getContent({ ...repo, path, ref });
              if (data.encoding !== 'base64' || !data.content) throw new Error('Cannot inspect source');
              return Buffer.from(data.content, 'base64').toString('utf8');
            }
            async function sensitive(file) {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              if (paths.some(path => path.startsWith('.github/') || /(?:sync|reset|delet|erase)/i.test(path))) return true;
              if (!paths.some(path => /\.(?:[cm]?js|html|json)$/i.test(path))) return false;
              if (!file.patch) return true; // Truncated/binary/unavailable diff: require review.
              const changes = file.patch.split('\n').filter(line => /^[+-]/.test(line) && !/^(---|\+\+\+)/.test(line));
              if (changes.some(line => marker.test(line))) return true;
              if (!mergeBase) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({ ...repo, basehead: `${pr.base.sha}...${pr.head.sha}` });
                mergeBase = data.merge_base_commit.sha;
              }
              const before = file.status === 'added' ? '' : await source(file.previous_filename || file.filename, mergeBase);
              const after = file.status === 'removed' ? '' : await source(file.filename, pr.head.sha);
              const oldRanges = ranges(before), newRanges = ranges(after);
              let oldLine = 0, newLine = 0;
              for (const line of file.patch.split('\n')) {
                const hunk = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
                if (hunk) { oldLine = Number(hunk[1]); newLine = Number(hunk[2]); continue; }
                if (line.startsWith('-')) {
                  if (oldRanges.some(([start, end]) => oldLine >= start && oldLine <= end)) return true;
                  oldLine++;
                } else if (line.startsWith('+')) {
                  if (newRanges.some(([start, end]) => newLine >= start && newLine <= end)) return true;
                  newLine++;
                } else if (line.startsWith(' ')) { oldLine++; newLine++; }
              }
              return false;
            }
            let review = files.length !== pr.changed_files;
            for (const file of files) if (await sensitive(file)) { review = true; break; }
            if (review) await github.rest.issues.addLabels({ ...repo, issue_number, labels: [label] });
            review ||= pr.labels.some(item => item.name === label);
            if (review && pr.auto_merge) await github.graphql(
              'mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { pullRequest { id } } }',
              { id: pr.node_id },
            );
            core.setOutput('needs_matias', String(review));
